# Lunara — Gradle ayarlari (GIT'E COMMIT EDILIR, sifre icermez)

org.gradle.jvmargs=-Xmx700m -XX:MaxMetaspaceSize=320m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- API adresi ---
# Release varsayilani: https://findsleepdoctors.com/api
# Debug varsayilani (emulator): http://10.0.2.2:4000
# -PapiBaseUrl=... ile override edilebilir.
apiBaseUrl=https://findsleepdoctors.com
debugApiBaseUrl=http://10.0.2.2:4000
