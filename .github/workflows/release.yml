name: Build release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.LUNARA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > keystore/lunara-release.jks

      - name: Build release APK
        working-directory: android
        env:
          LUNARA_STORE_FILE: keystore/lunara-release.jks
          LUNARA_KEY_ALIAS: ${{ secrets.LUNARA_KEY_ALIAS }}
          LUNARA_STORE_PASSWORD: ${{ secrets.LUNARA_STORE_PASSWORD }}
          LUNARA_KEY_PASSWORD: ${{ secrets.LUNARA_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          name: Lunara ${{ github.ref_name }}
          body: |
            ## Lunara ${{ github.ref_name }}

            Free sleep tracking + free sleep doctor finder, by
            [findsleepdoctors.com](https://findsleepdoctors.com/).

            - **100% free** — no ads, no subscription, no paywall
            - 21,343 sleep specialists across 6 countries
            - Raw audio never leaves your device

            Requires Android 8.0 (API 26) or newer.
